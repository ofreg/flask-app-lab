<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <title>{% block title %}Мій сайт{% endblock %}</title>
</head>
<body>
    <header class="bg-primary text-white py-3">
        <nav class="container">
            <ul class="nav justify-content-center">
                <li class="nav-item"></li>
                <a class="nav-link text-white" href="{{ url_for('recipes.recipes_list') }}">Усі рецепти</a></li>
                {% if current_user.is_authenticated %}
            
                    <!-- Якщо користувач авторизований -->
                    
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{{ url_for('recipes.recipe_account') }}">Профіль</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{{ url_for('recipes.logout') }}">Вихід</a>
                    </li>
                {% else %}
                    <!-- Якщо користувач не авторизований -->
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{{ url_for('recipes.register') }}">Реєстрація</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{{ url_for('recipes.login') }}">Вхід</a>
                    </li>
                {% endif %}
            </ul>
        </nav>
    </header>
    

    <main class="container mt-5">
        {% block content %}{% endblock %}
    </main>

   

   
</body>
</html>
